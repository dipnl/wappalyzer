name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [21.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci

      - name: Show versions
        run: |
          node -v
          npm -v

      - name: Run unit tests (node --test)
        env:
          PUPPETEER_EXECUTABLE_PATH: ''
        run: |
          npm test --silent

      - name: Smoke tests
        env:
          # Puppeteer/Chromium stability flags for CI
          CHROMIUM_ARGS: "--headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage"
        run: |
          npm run smoke --silent

      - name: Verify script
        run: |
          node scripts/verify.js https://example.com
